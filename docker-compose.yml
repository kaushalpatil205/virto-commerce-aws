version: '3.8'

networks:
  virto-network:
    driver: bridge

volumes:
  vc-db-data:
    driver: local
  vc-platform-data:
    driver: local
  vc-storefront-data:
    driver: local

services:
  # 1. Database Engine (SQL Server 2022)
  vc-db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: vc-database
    restart: unless-stopped
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=VirtoCommerce@2026!
      - MSSQL_PID=Express
    ports:
      - "1433:1433"
    volumes:
      - vc-db-data:/var/opt/mssql
    networks:
      - virto-network
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'VirtoCommerce@2026!' -C -Q 'SELECT 1' || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P 'VirtoCommerce@2026!' -Q 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # 2. Virto Commerce Backend Platform API
  vc-platform:
    image: virtocommerce/platform:latest
    container_name: vc-platform-backend
    restart: unless-stopped
    depends_on:
      vc-db:
        condition: service_healthy
    ports:
      - "8081:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__VirtoCommerce=Data Source=vc-db;Initial Catalog=VirtoCommerce3;Persist Security Info=True;User ID=sa;Password=VirtoCommerce@2026!;TrustServerCertificate=True;MultipleActiveResultSets=True;Connect Timeout=60;
      - ConnectionStrings__AssetsConnectionString=provider=LocalStorage;rootPath=~/App_Data/Assets;publicUrl=http://localhost:8081/assets
      - VirtoCommerce__AWS__ServiceUrl=http://host.docker.internal:4566
      - VirtoCommerce__AWS__Region=us-east-1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_DEFAULT_REGION=us-east-1
    volumes:
      - vc-platform-data:/app/App_Data
    networks:
      virto-network:
        aliases:
          - vc-platform
          - vc-platform-backend

  # 3. Virto Commerce Frontend Storefront
  vc-storefront:
    image: virtocommerce/storefront:latest
    container_name: vc-storefront-frontend
    restart: unless-stopped
    depends_on:
      - vc-platform
    ports:
      - "8090:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - VirtoCommerce__Endpoint__Url=http://vc-platform
      - ConnectionStrings__ContentConnectionString=provider=LocalStorage;rootPath=~/cms-content
    volumes:
      - vc-storefront-data:/app/cms-content
    networks:
      - virto-network
