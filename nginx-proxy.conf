events {}

http {
    upstream backend {
        server vc-platform-backend:80;
    }

    upstream storefront {
        server vc-storefront-frontend:80;
    }

    server {
        listen 80;

        # Match /api/stores or /api/stores/ (Storefront bootstrap call expecting array)
        location ~ ^/api/stores/?$ {
            default_type application/json;
            if ($request_method = GET) {
                return 200 '[{"id":"B2B-store","name":"B2B-store","description":"Main B2B Storefront","url":"http://localhost:8090","secureUrl":"http://localhost:8090","catalog":"fc596540864a41bf8ab78734ee7353a3","defaultLanguage":"en-US","defaultCurrency":"USD","languages":["en-US","fr-FR","de-DE"],"currencies":["USD","EUR"],"trustedGroups":[],"dynamicProperties":[{"name":"DefaultThemeName","values":[{"value":"default"}]}],"seoInfos":[],"settings":[{"name":"DefaultThemeName","value":"default"},{"name":"Stores.IsSpa","value":"true"},{"name":"Stores.AllowAnonymousUsers","value":"true"},{"name":"Stores.TaxCalculationEnabled","value":"false"},{"name":"Stores.EmailVerificationEnabled","value":"false"},{"name":"Stores.SeoLinksType","value":"Short"},{"name":"Quotes.EnableQuotes","value":"false"}],"Settings":[{"name":"DefaultThemeName","value":"default"},{"name":"Stores.IsSpa","value":"true"},{"name":"Stores.AllowAnonymousUsers","value":"true"},{"name":"Stores.TaxCalculationEnabled","value":"false"},{"name":"Stores.EmailVerificationEnabled","value":"false"},{"name":"Stores.SeoLinksType","value":"Short"},{"name":"Quotes.EnableQuotes","value":"false"}],"storeState":0,"timeZone":"UTC","country":"USA","region":"US"}]';
            }
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Match /api/cms/{storeId}/menu - pass through to real platform CMS with auth
        location ~ ^/api/cms/[^/]+/menu {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Authorization "Basic YWRtaW46c3RvcmU=";
        }

        # Match /api/seoinfos/{slug} for dynamic SEO lookups
        location ~ ^/api/seoinfos/(?<slug>.+)$ {
            rewrite ^ /api/seoinfos/search break;
            proxy_pass http://backend;
            proxy_method POST;
            proxy_set_header Content-Type "application/json";
            proxy_set_body '{"permalink":"$slug","storeId":"B2B-store"}';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Authorization "Basic YWRtaW46c3RvcmU=";
        }

        # Platform OAuth token endpoint
        location /connect/ {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Match all Platform REST APIs (/api/...)
        location /api/ {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # GraphQL API endpoint for modern frontend
        location /graphql {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        location ~ ^/xapi/graphql/?$ {
            rewrite ^ /graphql break;
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # Catalog product images and attachments (Platform backend)
        location /assets/catalog/ {
            proxy_pass http://backend/assets/catalog/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Direct static asset serving (JS, CSS, static files from Storefront)
        location /assets/ {
            proxy_pass http://storefront;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /static/ {
            proxy_pass http://storefront;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Frontend SPA HTML5 history routing with automatic index fallback
        location / {
            proxy_pass http://storefront;
            proxy_intercept_errors on;
            error_page 404 =200 @spa_fallback;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        location @spa_fallback {
            rewrite ^ / break;
            proxy_pass http://storefront;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
